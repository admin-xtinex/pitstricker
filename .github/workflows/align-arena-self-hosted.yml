name: Align Arena on Self-Hosted Windows

concurrency:
  group: align-arena-self-hosted
  cancel-in-progress: true

on:
  push:
    branches:
      - dev-isotrophic
    paths:
      - 'pitstricker/Assets/_Project/Scripts/Core/**'
      - 'pitstricker/Assets/_Project/Scenes/**'
      - 'pitstricker/Packages/manifest.json'
      - 'Tools/Blender/**'
      - '.github/workflows/align-arena-self-hosted.yml'
  workflow_dispatch:
    inputs:
      map:
        description: 'Dress to apply after snapping pits to 0/12/24'
        required: true
        default: 'beach'
        type: choice
        options:
          - beach
          - village
      push_scene:
        description: 'Commit aligned scene + generated meshes back to this branch'
        required: true
        default: true
        type: boolean

jobs:
  align:
    name: Align on self-hosted Unity
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && !contains(github.event.head_commit.message, '[skip ci]'))
    runs-on: [self-hosted, Windows]
    timeout-minutes: 90
    permissions:
      contents: write

    steps:
      - name: Stop leftover Unity and compilers
        shell: powershell
        run: |
          $names = @('Unity','UnityCrashHandler64','UnityCrashHandler32','UnityShaderCompiler','VBCSCompiler')
          foreach ($n in $names) {
            $procs = Get-Process -Name $n -ErrorAction SilentlyContinue
            if ($procs) {
              Write-Host "Stopping $n PIDs: $($procs.Id -join ', ')"
              $procs | Stop-Process -Force -ErrorAction SilentlyContinue
            }
          }
          Start-Sleep -Seconds 4
          Write-Host 'Process cleanup done.'

      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          lfs: false
          ref: ${{ github.ref }}

      - name: Clear locked Bee updater files
        shell: powershell
        run: |
          $paths = @(
            'pitstricker\Library\Bee\artifacts\mvdfrm',
            'pitstricker\Temp'
          )
          foreach ($p in $paths) {
            if (Test-Path $p) {
              Write-Host "Removing $p"
              Remove-Item $p -Recurse -Force -ErrorAction SilentlyContinue
            }
          }
          Write-Host 'Bee/Temp cleanup done.'

      - name: Locate Unity 6000.6.0f1
        shell: cmd
        run: |
          if not exist "C:\Program Files\Unity\Hub\Editor\6000.6.0f1\Editor\Unity.exe" (
            echo Unity 6000.6.0f1 not found.
            exit /b 1
          )
          echo Unity found.

      - name: Run arena pipeline in Unity batchmode
        shell: powershell
        run: |
          $map = "${{ github.event_name == 'workflow_dispatch' && inputs.map || 'beach' }}"
          $method = if ($map -eq 'village') {
            'PitStriker.EditorTools.ArenaPipeline.RunVillageAlign'
          } else {
            'PitStriker.EditorTools.ArenaPipeline.RunBeachAlign'
          }
          $unity = 'C:\Program Files\Unity\Hub\Editor\6000.6.0f1\Editor\Unity.exe'
          $log = Join-Path $pwd 'unity_align.log'
          if (Test-Path $log) { Remove-Item $log -Force }
          New-Item -ItemType File -Path $log | Out-Null
          Write-Host "map=$map"
          Write-Host "executeMethod $method"
          $proc = Start-Process -FilePath $unity -ArgumentList @(
            '-batchmode',
            '-nographics',
            '-quit',
            '-disable-assembly-updater',
            '-projectPath', 'pitstricker',
            '-executeMethod', $method,
            '-logfile', $log
          ) -PassThru -WindowStyle Hidden
          $offset = 0
          $deadline = (Get-Date).AddMinutes(60)
          while (-not $proc.HasExited) {
            if ((Get-Date) -gt $deadline) {
              Write-Host 'Unity exceeded 60 minutes. Killing.'
              Stop-Process -Id $proc.Id -Force
              Start-Sleep -Seconds 2
              throw 'Unity batchmode timed out'
            }
            Start-Sleep -Seconds 20
            if (Test-Path $log) {
              $lines = Get-Content $log -ErrorAction SilentlyContinue
              if ($lines -and $lines.Count -gt $offset) {
                $lines[$offset..($lines.Count - 1)] | ForEach-Object { Write-Host $_ }
                $offset = $lines.Count
              } else {
                Write-Host "[wait] Unity PID $($proc.Id) still running, log lines=$offset"
              }
            }
          }
          $proc.Refresh()
          $code = $proc.ExitCode
          if (Test-Path $log) {
            $lines = Get-Content $log -ErrorAction SilentlyContinue
            if ($lines -and $lines.Count -gt $offset) {
              $lines[$offset..($lines.Count - 1)] | ForEach-Object { Write-Host $_ }
            }
          }
          Write-Host "Unity exit code: $code"
          if ($null -eq $code -or $code -ne 0) {
            Write-Error "Unity arena pipeline failed with exit code $code"
            exit 1
          }
          $result = 'pitstricker/Library/ArenaPipeline.result'
          if (Test-Path $result) {
            Write-Host 'Pipeline result:'
            Get-Content $result
          }
          $beach = 'pitstricker/Assets/_Project/Scenes/SC_Beach_Graphics_Test.unity'
          if ($map -eq 'beach' -and -not (Test-Path $beach)) {
            Write-Error "Beach scene was not created: $beach"
            exit 1
          }
          if (Test-Path $beach) {
            Write-Host "Beach scene ready: $beach"
          }

      - name: Upload Unity log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unity-align-log-${{ github.run_number }}
          path: unity_align.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Commit aligned scene back to branch
        if: success()
        shell: powershell
        run: |
          $shouldPush = $true
          if ('${{ github.event_name }}' -eq 'workflow_dispatch' -and '${{ inputs.push_scene }}' -eq 'false') {
            $shouldPush = $false
          }
          if (-not $shouldPush) {
            Write-Host 'push_scene=false, skip commit.'
            exit 0
          }
          git config user.name "pitstriker-self-hosted"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "pitstricker/Assets/_Project/Scenes" `
                    "pitstricker/Assets/_Project/Art/Environments/Village" `
                    "pitstricker/Assets/_Project/Art/Environments/Beach" `
                    "pitstricker/ProjectSettings/EditorBuildSettings.asset"
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "No scene/art changes to commit."
            exit 0
          }
          git commit -m "Add playable SC_Beach_Graphics_Test aligned to ArenaFrame 0/12/24 [skip ci]"
          git push origin HEAD:${{ github.ref_name }}
